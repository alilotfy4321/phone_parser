name: smart_phone_parser
description: A zero-dependency global phone parser and selector supporting multiple UI design styles with automatic input normalization.
version: 1.0.1
homepage: https://github.com/alilotfy4321/smart_phone_parser
repository: https://github.com/alilotfy4321/smart_phone_parser
issue_tracker: https://github.com/alilotfy4321/smart_phone_parser/issues

# Author information
authors:
  - Ali Lotfy <alilotfy4321@gmail.com>

# Maintainers
maintainers:
  - Ali Lotfy <alilotfy4321@gmail.com>

# Documentation
documentation: https://github.com/alilotfy4321/smart_phone_parser/blob/main/README.md

# Topics for better discovery on pub.dev
topics:
  - phone
  - parser
  - international
  - validation
  - flutter
  - phone-number
  - country-picker
  - input-field
  - mobile-number
  - international-phone

# Funding
funding:
  - https://github.com/sponsors/alilotfy4321

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

