name: smart_phone_parser
description: A zero-dependency global phone parser and selector supporting multiple UI design styles with automatic input normalization.
version: 1.0.3
homepage: https://github.com/alilotfy4321/smart_phone_parser
repository: https://github.com/alilotfy4321/smart_phone_parser
issue_tracker: https://github.com/alilotfy4321/smart_phone_parser/issues


# Maintainers
maintainers:
  - Ali Lotfy <alilotfy4321@gmail.com>

# Documentation
documentation: https://github.com/alilotfy4321/smart_phone_parser/blob/main/README.md

# Topics for better discovery on pub.dev
topics:
  - phone
  - parser
  - international
  - country-picker
  - input-field

# Funding
funding:
  - https://github.com/sponsors/alilotfy4321

environment:
  sdk: ">=3.0.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

# Screenshots for pub.dev
screenshots:
  - description: 'Simple phone input field with country flag and dial code'
    path: screenshots/1.jpeg
  - description: 'User entering phone number with automatic country detection'
    path: screenshots/2.jpeg
  - description: 'Country picker bottom sheet with search feature'
    path: screenshots/3.jpeg
  - description: 'Selecting country from the picker list'
    path: screenshots/4.jpeg
  - description: 'Form validation with error message'
    path: screenshots/5.jpeg
  - description: 'Material Design 3 modern style'
    path: screenshots/9.jpeg
  - description: 'Phone number formatting options (E.164, Readable, Local)'
    path: screenshots/10.jpeg
  - description: 'Dialog picker for country selection (alternative to bottom sheet)'
    path: screenshots/12.jpeg
  - description: 'Dialog picker for country code selection'
    path: screenshots/dialog for pick country code.jpeg
  - description: 'Default favorite countries (Egypt and Saudi Arabia)'
    path: screenshots/fav countries default.jpeg
  - description: 'Simple login screen with phone and password fields'
    path: screenshots/simple login.jpeg
  - description: 'User can assign his own favorite countries'
    path: screenshots/user assign his fav countries.jpeg

flutter:
  uses-material-design: true